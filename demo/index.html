<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe Matchmaking Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .app { max-width: 600px; width: 100%; }
  h1 {
    text-align: center;
    font-size: 2rem;
    margin-bottom: 1.5rem;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .card {
    background: #1e293b;
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1rem;
    border: 1px solid #334155;
  }
  .card h2 {
    font-size: 1.1rem;
    margin-bottom: 1rem;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .form-row { display: flex; gap: 0.75rem; margin-bottom: 0.75rem; }
  input, select {
    flex: 1;
    padding: 0.6rem 0.8rem;
    border: 1px solid #475569;
    border-radius: 8px;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, select:focus { border-color: #3b82f6; }
  button {
    padding: 0.6rem 1.2rem;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary { background: #3b82f6; color: #fff; }
  .btn-primary:hover { background: #2563eb; }
  .btn-secondary { background: #475569; color: #e2e8f0; }
  .btn-secondary:hover { background: #64748b; }
  .btn-danger { background: #ef4444; color: #fff; }
  .btn-danger:hover { background: #dc2626; }
  .btn-success { background: #22c55e; color: #fff; }
  .btn-success:hover { background: #16a34a; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }
  .turn-indicator { font-size: 1.2rem; font-weight: 700; }
  .turn-indicator.x { color: #60a5fa; }
  .turn-indicator.o { color: #f472b6; }
  .game-status { font-size: 0.85rem; padding: 0.3rem 0.6rem; border-radius: 99px; }
  .game-status.playing { background: #1e3a5f; color: #60a5fa; }
  .game-status.won { background: #14532d; color: #4ade80; }
  .game-status.draw { background: #422006; color: #fbbf24; }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    margin: 0 auto;
    max-width: 300px;
  }
  .cell {
    aspect-ratio: 1;
    background: #334155;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
  }
  .cell:hover:not(.taken):not(.disabled) { background: #475569; }
  .cell.taken { cursor: default; }
  .cell.disabled { cursor: default; opacity: 0.7; }
  .cell.x { color: #60a5fa; }
  .cell.o { color: #f472b6; }
  .info-row { display: flex; gap: 1rem; margin-top: 1rem; font-size: 0.85rem; color: #94a3b8; }
  .players { display: flex; gap: 1rem; margin-bottom: 1rem; }
  .player-badge { padding: 0.3rem 0.7rem; border-radius: 6px; font-weight: 600; font-size: 0.85rem; }
  .player-badge.x { background: #1e3a5f; color: #60a5fa; }
  .player-badge.o { background: #4a1942; color: #f472b6; }
  .queue-status {
    text-align: center;
    padding: 2rem;
  }
  .queue-status .spinner {
    width: 48px; height: 48px;
    border: 4px solid #334155;
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .queue-status .players-waiting { margin-top: 1rem; font-size: 0.9rem; color: #94a3b8; }
  .games-list { list-style: none; }
  .games-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.6rem 0.8rem;
    background: #0f172a;
    border-radius: 8px;
    margin-bottom: 0.5rem;
    font-size: 0.9rem;
  }
  .games-list li button { padding: 0.4rem 0.8rem; font-size: 0.85rem; }
  .log {
    max-height: 200px;
    overflow-y: auto;
    font-family: 'Fira Code', monospace;
    font-size: 0.8rem;
    line-height: 1.6;
    color: #94a3b8;
  }
  .log-entry { padding: 0.2rem 0; border-bottom: 1px solid #1e293b; }
  .log-entry.error { color: #f87171; }
  .log-entry.success { color: #4ade80; }
  .log-entry.info { color: #60a5fa; }
  .hidden { display: none; }
  .empty-state { text-align: center; color: #64748b; padding: 1rem; font-size: 0.9rem; }
  .token-bar { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1rem; }
  .token-bar input { font-size: 0.85rem; }
  .token-bar span { font-size: 0.8rem; color: #64748b; white-space: nowrap; }
  .connection-dot {
    width: 8px; height: 8px; border-radius: 50%;
    display: inline-block; margin-right: 4px;
  }
  .connection-dot.online { background: #4ade80; }
  .connection-dot.offline { background: #ef4444; }
  .match-banner {
    background: linear-gradient(135deg, #1e3a5f, #4a1942);
    border-radius: 12px;
    padding: 1.5rem;
    text-align: center;
    margin-bottom: 1rem;
    animation: pulse 2s ease-in-out;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.85; } }
  .match-banner h3 { font-size: 1.3rem; margin-bottom: 0.5rem; }
  .match-banner p { color: #94a3b8; }
</style>
</head>
<body>
<div class="app">
  <h1>⬡ Tic-Tac-Toe Matchmaking</h1>

  <div class="card">
    <h2>⚙ Configuração</h2>
    <div class="token-bar">
      <span>Token:</span>
      <input type="text" id="apiToken" value="secret-token" placeholder="Bearer token">
      <button class="btn-secondary" onclick="saveToken()">Salvar</button>
    </div>
  </div>

  <div class="card">
    <h2>🔍 Matchmaking</h2>
    <div class="form-row">
      <input type="text" id="playerName" placeholder="Seu nome" value="Alice">
    </div>
    <div style="display:flex;gap:0.75rem;margin-bottom:1rem">
      <button class="btn-primary" id="joinBtn" onclick="joinQueue()">Entrar na Fila</button>
      <button class="btn-danger hidden" id="leaveBtn" onclick="leaveQueue()">Sair da Fila</button>
    </div>
    <div id="queueArea">
      <div class="empty-state">Aguardando jogadores na fila...</div>
    </div>
  </div>

  <div id="matchBanner" class="match-banner hidden">
    <h3>🎉 Match Encontrado!</h3>
    <p id="matchInfo"></p>
  </div>

  <div class="card hidden" id="gameCard">
    <div class="status-bar">
      <div style="display:flex;align-items:center;gap:1rem">
        <div class="turn-indicator" id="turnIndicator">Vez: X</div>
        <span class="game-status playing" id="gameStatus">PLAYING</span>
      </div>
      <button class="btn-danger" onclick="leaveGame()">Sair</button>
    </div>
    <div class="players" id="playersInfo"></div>
    <div class="board" id="board"></div>
    <div class="info-row">
      <span>ID: <code id="gameIdDisplay">-</code></span>
      <span id="winnerInfo"></span>
    </div>
  </div>

  <div class="card">
    <h2>📋 Jogos</h2>
    <ul class="games-list" id="gamesList">
      <li class="empty-state">Nenhum jogo criado ainda</li>
    </ul>
  </div>

  <div class="card">
    <h2>
      <span class="connection-dot offline" id="connDot"></span>
      📡 Eventos
    </h2>
    <div class="log" id="eventLog">
      <div class="log-entry">Aguardando conexão...</div>
    </div>
  </div>
</div>

<script>
const API_BASE = 'http://localhost:3000';
let token = localStorage.getItem('ttt_token') || 'secret-token';
let currentGame = null;
let eventSource = null;
let matchmakingSource = null;
let playerName = '';

function saveToken() {
  token = document.getElementById('apiToken').value.trim();
  localStorage.setItem('ttt_token', token);
  addLog('Token salvo', 'success');
}

async function api(path, options = {}) {
  const res = await fetch(API_BASE + path, {
    headers: {
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json',
      ...(options.headers || {}),
    },
    ...options,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

async function joinQueue() {
  try {
    playerName = document.getElementById('playerName').value.trim();
    if (!playerName) return alert('Informe seu nome');
    document.getElementById('joinBtn').disabled = true;
    document.getElementById('joinBtn').textContent = 'Entrando...';
    const result = await api('/matchmaking/join', {
      method: 'POST',
      body: JSON.stringify({ playerName }),
    });
    if (result.game) {
      addLog(`Match encontrado com ${result.opponentName}!`, 'success');
      showMatchBanner(result.opponentName, result.game);
      currentGame = result.game;
      renderGame(result.game);
      connectGameEvents(result.game.id);
    } else {
      addLog(`Na fila (posição ${result.queuePosition})`, 'info');
      updateQueueStatus('waiting');
    }
  } catch (e) {
    addLog(`Erro: ${e.message}`, 'error');
    document.getElementById('joinBtn').disabled = false;
    document.getElementById('joinBtn').textContent = 'Entrar na Fila';
  }
}

async function leaveQueue() {
  try {
    addLog('Saindo da fila...', 'info');
    await api('/matchmaking/leave', {
      method: 'DELETE',
      body: JSON.stringify({ playerName }),
    });
    document.getElementById('leaveBtn').classList.add('hidden');
    document.getElementById('joinBtn').disabled = false;
    document.getElementById('joinBtn').textContent = 'Entrar na Fila';
    updateQueueStatus('left');
    addLog('Saiu da fila', 'success');
  } catch (e) {
    addLog(`Erro: ${e.message}`, 'error');
  }
}

async function loadGame(id) {
  try {
    const game = await api(`/games/${id}`);
    currentGame = game;
    document.getElementById('gameCard').classList.remove('hidden');
    renderGame(game);
    connectGameEvents(game.id);
  } catch (e) {
    addLog(`Erro: ${e.message}`, 'error');
  }
}

async function makeMove(row, col) {
  if (!currentGame || currentGame.status !== 'PLAYING') return;
  try {
    const game = await api(`/games/${currentGame.id}/moves`, {
      method: 'POST',
      body: JSON.stringify({ playerSymbol: currentGame.turn, row, col }),
    });
    currentGame = game;
    renderGame(game);
    addLog(`${game.turn} jogou (${row},${col})`, 'success');
  } catch (e) {
    addLog(`Erro: ${e.message}`, 'error');
  }
}

function leaveGame() {
  currentGame = null;
  if (eventSource) { eventSource.close(); eventSource = null; }
  document.getElementById('gameCard').classList.add('hidden');
  addLog('Saiu do jogo');
}

function showMatchBanner(opponent, game) {
  document.getElementById('matchBanner').classList.remove('hidden');
  document.getElementById('matchInfo').textContent = `Você vs ${opponent}`;
  document.getElementById('joinBtn').disabled = false;
  document.getElementById('joinBtn').textContent = 'Entrar na Fila';
}

function updateQueueStatus(state) {
  const area = document.getElementById('queueArea');
  if (state === 'waiting') {
    area.innerHTML = `
      <div class="queue-status">
        <div class="spinner"></div>
        <div>Procurando adversário...</div>
        <div class="players-waiting">Você está na fila</div>
      </div>`;
    document.getElementById('leaveBtn').classList.remove('hidden');
  } else if (state === 'left') {
    area.innerHTML = '<div class="empty-state">Você saiu da fila</div>';
    document.getElementById('leaveBtn').classList.add('hidden');
  }
}

function renderGame(game) {
  document.getElementById('gameCard').classList.remove('hidden');
  document.getElementById('gameIdDisplay').textContent = game.id;

  const turnEl = document.getElementById('turnIndicator');
  turnEl.textContent = `Vez: ${game.turn}`;
  turnEl.className = `turn-indicator ${game.turn.toLowerCase()}`;

  const statusEl = document.getElementById('gameStatus');
  statusEl.textContent = game.status;
  statusEl.className = `game-status ${game.status.toLowerCase()}`;

  const playersInfoEl = document.getElementById('playersInfo');
  playersInfoEl.innerHTML = '';
  const badgeX = document.createElement('span');
  badgeX.className = 'player-badge x';
  badgeX.textContent = `X: ${game.players.X}`;
  const badgeO = document.createElement('span');
  badgeO.className = 'player-badge o';
  badgeO.textContent = `O: ${game.players.O}`;
  playersInfoEl.appendChild(badgeX);
  playersInfoEl.appendChild(badgeO);

  document.getElementById('winnerInfo').textContent =
    game.status === 'WON' ? `🏆 Vencedor: ${game.players[game.winner]}` :
    game.status === 'DRAW' ? '🤝 Empate!' : '';

  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) {
      const cell = document.createElement('div');
      const val = game.board[r][c];
      if (val) {
        cell.className = 'cell taken ' + val.toLowerCase();
        cell.textContent = val;
      } else if (game.status === 'PLAYING') {
        cell.className = 'cell';
        cell.onclick = () => makeMove(r, c);
      } else {
        cell.className = 'cell disabled';
      }
      boardEl.appendChild(cell);
    }
  }
}

async function listGames() {
  try {
    const games = await api('/games');
    renderGamesList(games);
    addLog(`${games.length} jogo(s) encontrado(s)`, 'success');
  } catch (e) {
    addLog(`Erro: ${e.message}`, 'error');
  }
}

function renderGamesList(games) {
  const ul = document.getElementById('gamesList');
  ul.innerHTML = '';
  if (!games.length) {
    const li = document.createElement('li');
    li.className = 'empty-state';
    li.textContent = 'Nenhum jogo';
    ul.appendChild(li);
    return;
  }
  for (const g of games) {
    const li = document.createElement('li');
    const span = document.createElement('span');
    span.textContent = `${g.players.X} vs ${g.players.O} — `;
    const strong = document.createElement('strong');
    strong.textContent = g.status;
    span.appendChild(strong);
    li.appendChild(span);

    const btn = document.createElement('button');
    btn.textContent = 'Entrar';
    btn.onclick = () => loadGame(g.id);
    li.appendChild(btn);

    ul.appendChild(li);
  }
}

function connectGameEvents(gameId) {
  if (eventSource) eventSource.close();
  const ev = new EventSource(`${API_BASE}/games/${gameId}/events?token=${token}`);
  eventSource = ev;
  ev.onopen = () => {
    document.getElementById('connDot').className = 'connection-dot online';
    addLog('Conectado ao stream do jogo', 'success');
  };
  ev.onmessage = (msg) => {
    try {
      const game = JSON.parse(msg.data);
      currentGame = game;
      renderGame(game);
    } catch {}
  };
  ev.onerror = () => {
    document.getElementById('connDot').className = 'connection-dot offline';
    addLog('Stream do jogo desconectado', 'error');
  };
}

function connectMatchmakingEvents() {
  if (matchmakingSource) matchmakingSource.close();
  const ev = new EventSource(`${API_BASE}/matchmaking/events?token=${token}`);
  matchmakingSource = ev;
  ev.onopen = () => addLog('Conectado ao stream de matchmaking', 'success');
  ev.onmessage = (msg) => {
    try {
      const event = JSON.parse(msg.data);
      addLog(`[MATCHMAKING] ${event.type}${event.playerName ? ': ' + event.playerName : ''}${event.opponentName ? ' vs ' + event.opponentName : ''}${event.gameId ? ' jogo:' + event.gameId : ''}`, 'info');

      if (event.type === 'MATCH_FOUND' && event.gameId) {
        addLog('Match encontrado! Carregando jogo...', 'success');
        loadGame(event.gameId);
      }
      if (event.type === 'PLAYER_LEFT') {
        updateQueueStatus('left');
      }
    } catch {}
  };
  ev.onerror = () => {
    addLog('Stream de matchmaking desconectado', 'error');
  };
}

function addLog(msg, type = '') {
  const log = document.getElementById('eventLog');
  const time = new Date().toLocaleTimeString();
  const entry = document.createElement('div');
  entry.className = `log-entry ${type}`;
  entry.textContent = `[${time}] ${msg}`;
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}

document.getElementById('apiToken').value = token;
connectMatchmakingEvents();
listGames();
</script>
</body>
</html>
